services:
  db:
    image: postgres:16-alpine
    command: postgres -c timezone=Europe/Zagreb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eloquence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eloquence_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eloquence}
      TZ: Europe/Zagreb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eloquence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Apply migrations on every start, then serve.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eloquence}:${POSTGRES_PASSWORD:-eloquence_dev}@db:5432/${POSTGRES_DB:-eloquence}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-eloquence}:${POSTGRES_PASSWORD:-eloquence_dev}@db:5432/${POSTGRES_DB:-eloquence}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env or shell env}
      ENV: ${ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dev@eloquence.local}
      TZ: Europe/Zagreb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_cache:/app/.cache

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-side routes (Google OAuth callback) run inside this container,
      # where localhost is the frontend itself; reach the backend by service name.
      INTERNAL_API_URL: http://backend:8000/api
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  backend_cache:
