name: CI

on:
  push:
    branches: [main, dev, eloquence2.0]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eloquence
          POSTGRES_PASSWORD: eloquence_dev
          POSTGRES_DB: eloquence_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eloquence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Cache pattern matrix
        uses: actions/cache@v4
        with:
          path: backend/.cache
          key: pattern-matrix-${{ hashFiles('backend/data/*.txt', 'backend/app/analysis/engine.py') }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://eloquence:eloquence_dev@localhost:5432/eloquence_test
        run: pytest -q

  frontend:
    name: Frontend (tsc + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
      - run: pnpm lint
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
